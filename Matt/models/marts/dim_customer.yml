models:
  - name: dim_customer
    description: One row per customer, including customers who have not placed any orders, with order counts, order dates, and lifetime successful payment amounts.
    columns:
      - name: customer_id
        description: Primary key identifying a customer.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer's first name.
      - name: last_name
        description: Customer's last name.
      - name: first_order_date
        description: Earliest order date for the customer; null for customers without orders.
        data_tests:
          - not_null:
              config:
                where: "number_of_orders > 0"
      - name: most_recent_order_date
        description: Latest order date for the customer; null for customers without orders.
        data_tests:
          - not_null:
              config:
                where: "number_of_orders > 0"
      - name: number_of_orders
        description: Number of orders placed by the customer, defaulting to zero for customers without orders.
        data_tests:
          - not_null
      - name: lifetime_value
        description: Total successful payment amounts across the customer's orders; null for customers without orders.
        data_tests:
          - not_null:
              config:
                where: "number_of_orders > 0"
