models:
  - name: fct_orders
    description: One row per order, with the total amount of successful payments. Orders without successful payments have an amount of zero.
    columns:
      - name: order_id
        description: Primary key identifying an order.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Customer who placed the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__customers')
                field: customer_id
      - name: order_date
        description: Date the order was placed.
        data_tests:
          - not_null
      - name: amount
        description: Sum of successful payment amounts for the order, defaulting to zero when no successful payments exist.
        data_tests:
          - not_null
