version: 2

sources:
  - name: stripe
    database: raw
    tables:
      - name: payment
        config:
          loaded_at_field: _batched_at
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 24, period: hour}
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
          - name: orderid
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('jaffle_shop', 'orders')
                    field: id
          - name: paymentmethod
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['bank_transfer', 'coupon', 'credit_card', 'gift_card']
          - name: status
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['fail', 'success']
