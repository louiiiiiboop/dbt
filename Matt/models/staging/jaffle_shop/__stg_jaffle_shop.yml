models:
  - name: stg_jaffle_shop__customers
    description: >-
      Customer staging model sourced from the jaffle_shop customers table.
      The intended grain is one row per customer, identified by customer_id.
      Renames the source id to customer_id and passes through first_name and
      last_name without filtering or deduplication. Includes customers regardless
      of whether they have placed an order and supplies customer attributes to
      dim_customer.
    columns:
      - name: customer_id
        description: >-
          Unique customer identifier, renamed from id in the source customers
          table. Primary key of this model and the join key for customer-level
          order and dimension models. Expected to be unique and non-null.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer's first name, passed through unchanged from the source customers table.
      - name: last_name
        description: Customer's last name, passed through unchanged from the source customers table.

  - name: stg_jaffle_shop__orders
    description: One order per row
    columns: 
      - name: order_id
        description: Primary Key for the orders table
        data_tests:
          - unique
          - not_null
      - name: order_status
        description: "{{ doc('order_status')}}"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - completed
                  - shipped
                  - placed
                  - return_pending
                  - returned
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                field: customer_id
                to: ref('stg_jaffle_shop__customers')

